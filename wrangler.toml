# Cloudflare Pages – Konfiguration für die Newsletter-Functions.
# Produktiv werden KV-Binding & Secrets im Cloudflare-Dashboard gesetzt
# (Pages-Projekt → Settings → Functions). Diese Datei dient v. a. der
# lokalen Entwicklung mit `wrangler pages dev`.

name = "zwei-teller"
pages_build_output_dir = "."
compatibility_date = "2025-01-01"

# KV-Namespace für die Abonnenten. Die ID bekommst du mit:
#   npx wrangler kv namespace create SUBSCRIBERS
# und trägst sie hier (und/oder im Dashboard) ein.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Nicht-geheime Variablen. RESEND_API_KEY NICHT hier eintragen –
# das ist ein Secret (siehe NEWSLETTER.md).
[vars]
RESEND_FROM = "zwei teller <onboarding@resend.dev>"
SITE_URL = "https://zwei-teller.pages.dev"
